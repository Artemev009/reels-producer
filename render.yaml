services:
  - type: web
    name: reels-finder
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reels-finder-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: APIFY_API_TOKEN
        sync: false
      - key: APIFY_ACTOR_ID
        value: apify/instagram-reel-scraper

databases:
  - name: reels-finder-db
    plan: free
    databaseName: reels_finder
    user: reels_finder
    ipAllowList: []
