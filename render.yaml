services:
  - type: web
    name: reels-finder
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reels-finder-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: APIFY_API_TOKEN
        sync: false
      - key: APIFY_ACTOR_ID
        value: apify/instagram-reel-scraper
      - key: APIFY_RESULTS_LIMIT
        value: "20"
      - key: APIFY_DOWNLOAD_VIDEOS
        value: "false"
      - key: DATABASE_MEDIA_CACHE
        value: "true"
      - key: DATABASE_MEDIA_REELS_LIMIT
        value: "5"
      - key: DATABASE_MEDIA_TOTAL_BYTES
        value: "293601280"
      - key: DATABASE_MEDIA_VIDEO_MAX_BYTES
        value: "52428800"
      - key: SYNC_COOLDOWN_MINUTES
        value: "10"
      - key: SYNC_HOURLY_LIMIT
        value: "3"
      - key: SYNC_DAILY_LIMIT
        value: "10"
      - key: COMPETITOR_LIMIT
        value: "10"
      - key: SCRIPT_LIMIT
        value: "200"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

databases:
  - name: reels-finder-db
    plan: free
    databaseName: reels_finder
    user: reels_finder
    ipAllowList: []
